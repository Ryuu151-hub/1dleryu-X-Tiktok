<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zernio Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0c;
      --card: #161616;
      --border: rgba(255,255,255,0.08);
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --amber: #f0900a;
      --green: #3dd68c;
      --red: #e05060;
      --glass: rgba(255,255,255,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    body.booting .shell { visibility: hidden; }
    .maintenance {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .maintenance[hidden] { display: none !important; }
    .maintenance-card {
      max-width: 420px; width: 100%; text-align: center;
      padding: 36px 28px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--card);
    }
    .maintenance-card h1 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .maintenance-card p { color: var(--muted); font-size: 14px; }

    .shell { max-width: 480px; margin: 0 auto; padding: 36px 16px 48px; }
    .brand { margin-bottom: 24px; text-align: center; }
    .brand h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.02em; }
    .brand h1 span { color: var(--amber); }
    .brand p { color: var(--muted); font-size: 13px; margin-top: 6px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 18px;
    }
    .card h2 {
      font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--amber); margin-bottom: 14px;
    }

    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; min-height: 48px; border-radius: 14px;
      border: 1.5px solid var(--border); background: var(--glass);
      color: var(--text); padding: 0 14px; font-size: 13px;
      font-family: inherit; outline: none;
    }
    input:focus { border-color: rgba(240,144,10,0.55); }

    .btn {
      width: 100%; min-height: 48px; margin-top: 12px;
      border-radius: 14px; border: none;
      background: linear-gradient(135deg, #f0900a 0%, #c46a00 100%);
      color: #111; font-size: 12px; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; font-family: inherit;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-outline {
      background: var(--glass); border: 1px solid var(--border); color: var(--text);
      margin-top: 10px;
    }

    .hint { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
    .hint a { color: var(--amber); }

    .err {
      margin-top: 12px; padding: 12px 14px; border-radius: 12px;
      background: rgba(224,80,96,0.1); border: 1px solid rgba(224,80,96,0.35);
      color: #ff8a96; font-size: 13px; display: none;
    }
    .err.show { display: block; }

    .ok-banner {
      padding: 14px 16px; border-radius: 14px; margin-bottom: 16px;
      background: rgba(61,214,140,0.1); border: 1px solid rgba(61,214,140,0.35);
      font-size: 13px; color: var(--green);
    }
    .meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .meta strong { color: var(--text); }

    #loginView[hidden], #homeView[hidden] { display: none !important; }
  </style>
</head>
<body class="booting">
  <div class="maintenance" id="maintenance" hidden>
    <div class="maintenance-card">
      <h1>Maintenance Mode</h1>
      <p id="maintenanceMsg">This website is in maintenance mode.</p>
    </div>
  </div>

  <div class="shell" id="shell">
    <div class="brand">
      <h1>Zernio <span>Login</span></h1>
      <p>Sign in with your own Zernio API key</p>
    </div>

    <div id="loginView">
      <div class="card">
        <h2>Login</h2>
        <label for="apiKeyInput">Zernio API key</label>
        <input type="password" id="apiKeyInput" placeholder="sk_…" autocomplete="off" spellcheck="false">
        <button class="btn" type="button" id="loginBtn">Login</button>
        <p class="hint">
          Get a key at
          <a href="https://zernio.com/dashboard/api-keys" target="_blank" rel="noopener">zernio.com/dashboard/api-keys</a>.
          Your key is verified with Zernio and is not stored in the browser cookie.
        </p>
        <div class="err" id="loginErr"></div>
      </div>
    </div>

    <div id="homeView" hidden>
      <div class="ok-banner">You are signed in.</div>
      <div class="card">
        <h2>Account</h2>
        <p class="meta">User ID: <strong id="userId">—</strong></p>
        <p class="meta">Key: <strong id="keyHint">—</strong></p>
        <p class="meta">Auth: <strong id="authType">—</strong></p>
        <button class="btn btn-outline" type="button" id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const $ = (id) => document.getElementById(id);

    function showErr(msg) {
      const el = $('loginErr');
      el.textContent = msg || '';
      el.classList.toggle('show', !!msg);
    }
    function showLogin() {
      $('loginView').hidden = false;
      $('homeView').hidden = true;
    }
    function showHome(user) {
      $('loginView').hidden = true;
      $('homeView').hidden = false;
      $('userId').textContent = user?.userId || '—';
      $('keyHint').textContent = user?.keyHint || '—';
      $('authType').textContent = user?.authType || '—';
    }

    async function boot() {
      try {
        const cfgRes = await fetch('/api/config', { credentials: 'include', cache: 'no-store' });
        const cfg = await cfgRes.json();
        if (cfg.maintenance) {
          $('maintenanceMsg').textContent = cfg.message || 'Maintenance mode.';
          $('maintenance').hidden = false;
          document.body.classList.remove('booting');
          return;
        }
      } catch { /* continue */ }

      try {
        const me = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' }).then((r) => r.json());
        if (me.loggedIn) showHome(me.user);
        else showLogin();
      } catch {
        showLogin();
      }
      document.body.classList.remove('booting');
    }

    $('loginBtn').addEventListener('click', async () => {
      const apiKey = ($('apiKeyInput').value || '').trim();
      showErr('');
      if (!apiKey) return showErr('Paste your Zernio API key.');
      $('loginBtn').disabled = true;
      $('loginBtn').textContent = '…';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey }),
        });
        const data = await r.json();
        if (!data.ok) {
          showErr(data.error || 'Login failed');
          return;
        }
        $('apiKeyInput').value = '';
        showHome(data.user);
      } catch (e) {
        showErr(e.message || 'Network error');
      } finally {
        $('loginBtn').disabled = false;
        $('loginBtn').textContent = 'Login';
      }
    });

    $('apiKeyInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('loginBtn').click();
    });

    $('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      showLogin();
    });

    boot();
  })();
  </script>
</body>
</html>
